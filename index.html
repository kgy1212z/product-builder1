<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 다음 여행지는 어디일까?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">서울, 어디까지 가봤니?</h1>
            <p class="subtitle">동네별로 정리한 서울의 보물같은 장소들</p>
            <div class="header-buttons">
                <button id="challenge-btn" class="challenge-btn">내 달성 현황</button>
                <button id="trip-course-btn" class="challenge-btn">내 여행 코스</button>
            </div>
        </header>

        <main>
            <div id="neighborhood-filters" class="theme-filters">
                <!-- Neighborhood buttons will be dynamically inserted here by app.js -->
            </div>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="장소 검색...">
            </div>

            <div id="destinations-grid" class="destinations-grid">
                <!-- Destination cards will be dynamically inserted here by app.js -->
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Ddalkkak. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="app.js"></script>

    <!-- Map Modal -->
    <div id="map-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body">
                <div id="map-container" class="map-container">
                    <!-- Google Maps iframe will be inserted here -->
                </div>
                <div id="modal-details-container" class="modal-details">
                    <!-- Destination details will be inserted here -->
                </div>
            </div>
        </div>
    </div>
    <!-- Challenge Modal -->
    <div id="challenge-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2>나의 도장 깨기</h2>
            </div>
            <div id="challenge-content" class="challenge-content">
                <!-- Challenge progress will be inserted here -->
            </div>
        </div>
    </div>
    <!-- Trip Course Modal -->
    <div id="trip-course-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2>나만의 여행 코스</h2>
            </div>
            <div id="trip-course-list" class="trip-course-list">
                <!-- Trip course items will be inserted here -->
            </div>
            <div class="modal-footer">
                <button id="clear-course-btn" class="btn-secondary">코스 비우기</button>
            </div>
        </div>
    </div>
</body>
</html>
