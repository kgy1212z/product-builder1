<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 다음 여행지는 어디일까?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">서울, 어디까지 가봤니?</h1>
            <p class="subtitle">테마별로 정리한 서울의 보물같은 장소들</p>
        </header>

        <main>
            <div id="theme-filters" class="theme-filters">
                <!-- Theme buttons will be dynamically inserted here by app.js -->
            </div>
            <div id="destinations-grid" class="destinations-grid">
                <!-- Destination cards will be dynamically inserted here by app.js -->
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Ddalkkak. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="app.js"></script>

    <!-- Map Modal -->
    <div id="map-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="map-container" class="map-container">
                <!-- Google Maps iframe will be inserted here -->
            </div>
        </div>
    </div>
</body>
</html>
