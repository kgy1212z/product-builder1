<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 다음 여행지는 어디일까?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 시작 화면 -->
        <section id="start-screen">
            <h1 class="title">나의 다음 여행지는 어디일까?</h1>
            <p class="subtitle">간단한 테스트를 통해 당신의 성향에 꼭 맞는 여행지를 찾아보세요!</p>
            <button id="start-btn" class="btn">테스트 시작하기</button>
        </section>

        <!-- 질문 화면 -->
        <section id="qna-screen" class="hidden">
            <div class="status-bar">
                <div class="status-bar-inner"></div>
            </div>
            <h2 id="question-title" class="question-title"></h2>
            <div id="choices" class="choices">
                <!-- 선택지는 JavaScript로 동적으로 추가됩니다. -->
            </div>
        </section>

        <!-- 결과 화면 -->
        <section id="result-screen" class="hidden">
            <h2 class="result-subtitle">당신에게 어울리는 여행지는...</h2>
            <h1 id="result-name" class="result-name"></h1>
            <div id="result-image"></div>
            <p id="result-desc" class="result-desc"></p>
            <div class="result-buttons">
                <button id="retry-btn" class="btn">다시 테스트하기</button>
                <button id="reco-btn" class="btn secondary">숨은 명소 추천받기</button>
            </div>
        </section>

        <!-- 추천 화면 -->
        <section id="reco-screen" class="hidden">
            <h2 class="reco-title">이런 곳은 어때요?</h2>
            <div id="reco-list">
                <!-- 추천 명소는 JavaScript로 동적으로 추가됩니다. -->
            </div>
            <button id="back-btn" class="btn">뒤로 가기</button>
        </section>

        <footer>
            <p>&copy; 2026 Ddalkkak. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
