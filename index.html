<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 인터랙티브 스토리</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="story-container">
        <div class="header">
            <h1>AI 인터랙티브 스토리</h1>
            <p>AI와 함께 당신만의 이야기를 만들어보세요. 아래 입력창에 원하는 행동을 입력하여 이야기를 시작할 수 있습니다.</p>
        </div>
        <div id="story-log"></div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="어떤 행동을 하시겠습니까? (예: '숲 속으로 들어간다')">
        <button id="submit-btn">전송</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
